{% extends 'todo/base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-6">

        <div class="card p-4 shadow">

            <h3>Edit Task</h3>

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <button class="btn btn-primary">

                    Update

                </button>

                <a href="/" class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
