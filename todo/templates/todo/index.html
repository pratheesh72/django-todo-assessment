{% extends 'todo/base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card shadow p-4">

            <h2 class="mb-4">
                To-Do List
            </h2>

            <form method="POST">

                {% csrf_token %}

                <div class="input-group mb-4">

                    <input type="text" name="title" class="form-control" placeholder="Enter task" maxlength="200"
                        required>

                    <button class="btn btn-primary">

                        Add Task

                    </button>

                </div>

            </form>

            <ul class="list-group">

                {% for task in tasks %}

                <li class="list-group-item d-flex justify-content-between align-items-center">

                    <span class="{% if task.completed %}completed{% endif %}">
                        {{ task.title }}
                    </span>

                    <div>

                        <a href="{% url 'complete' task.id %}" class="btn btn-success btn-sm">

                            Complete

                        </a>

                        <a href="{% url 'update' task.id %}" class="btn btn-warning btn-sm">

                            Edit

                        </a>

                        <a href="{% url 'delete' task.id %}" class="btn btn-danger btn-sm">

                            Delete

                        </a>

                    </div>

                </li>

                {% empty %}

                <li class="list-group-item">
                    No tasks yet.
                </li>

                {% endfor %}

            </ul>

        </div>

    </div>

</div>

{% endblock %}
